<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Task Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1 class="logo">Kanban Board</h1>

    <div class="header-controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Search tasks...">
      <select id="priorityFilter" class="filter-select">
        <option value="all">All priorities</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
      <button id="addTaskBtn" class="add-btn">+ New Task</button>
    </div>
  </header>

  <main class="board">
    <div class="column" data-status="waiting">
      <div class="column-header">
        <h2>To Do</h2>
        <span class="task-count" id="count-waiting">0</span>
      </div>
      <div class="task-list" id="list-waiting"></div>
    </div>

    <div class="column" data-status="progress">
      <div class="column-header">
        <h2>In Progress</h2>
        <span class="task-count" id="count-progress">0</span>
      </div>
      <div class="task-list" id="list-progress"></div>
    </div>

    <div class="column" data-status="done">
      <div class="column-header">
        <h2>Done</h2>
        <span class="task-count" id="count-done">0</span>
      </div>
      <div class="task-list" id="list-done"></div>
    </div>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">New Task</h3>
        <button class="close-btn" id="modalClose">&times;</button>
      </div>

      <form id="taskForm">
        <input type="hidden" id="taskId">

        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="taskTitle" placeholder="Task name">
          <small class="error-text" id="titleError"></small>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea id="taskDesc" placeholder="Short note..."></textarea>
        </div>

        <div class="form-group">
          <label>Priority</label>
          <select id="taskPriority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>

        <div class="form-group">
          <label>Column</label>
          <select id="taskStatus">
            <option value="waiting">To Do</option>
            <option value="progress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn-save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <p id="confirmMessage"></p>
      <div class="confirm-actions">
        <button class="btn-cancel" id="confirmCancelBtn">Cancel</button>
        <button class="btn-delete" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
